<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bind-my-tabs</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="terminal">
    <div class="bar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">bind-my-tabs v1.3.0</span>
    </div>
    <div class="content">
      <div class="section-head">
        <span class="cmd-label">$ status</span>
      </div>
      <div class="line out"><span class="tag ok">[OK]</span> daemon running</div>
      <div class="line out"><span class="tag info">[TABS]</span> <span id="tab-count">...</span> tabs open</div>

      <div class="section-head">
        <span class="cmd-label">$ bindings</span>
      </div>
      <div class="line binding"><span class="cmd">next-tab</span> <span class="key" id="key-next">...</span></div>
      <div class="line binding"><span class="cmd">prev-tab</span> <span class="key" id="key-prev">...</span></div>
      <div class="line binding"><span class="cmd">history-back</span> <span class="key" id="key-history-back">...</span></div>
      <div class="line binding"><span class="cmd">history-forward</span> <span class="key" id="key-history-forward">...</span></div>

      <div class="section-head">
        <span class="cmd-label">$ settings</span>
      </div>
      <div class="setting-row">
        <span class="setting-label"><span class="tag info">[HIST]</span> tab history nav</span>
        <label class="switch">
          <input type="checkbox" id="toggle-history" checked>
          <span class="slider"></span>
        </label>
      </div>
      <div class="actions-split">
        <button id="btn-cfg-brave" class="btn-split" title="brave://extensions/shortcuts">$ brave://shortcuts</button>
        <span class="split-divider"></span>
        <button id="btn-cfg-chrome" class="btn-split" title="chrome://extensions/shortcuts">$ chrome://shortcuts</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
